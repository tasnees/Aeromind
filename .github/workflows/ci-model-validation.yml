name: Model Validation & Reproducibility Gate

on:
  push:
    paths:
      - 'aeromind/models/**'
      - 'aeromind/training/**'
      - 'aeromind/data/**'
  workflow_dispatch:

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset schemas
        run: |
          python -m aeromind.data.pipeline --dataset FD001 --window-size 30 --max-rul 125

      - name: Run training smoke test
        run: |
          python -m aeromind.training.experiments --exp EXP-01 --epochs 2 --batch-size 128

