version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: aeromind-backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=production
    depends_on:
      - mlflow
      - qdrant
    networks:
      - aeromind-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aeromind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - aeromind-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: aeromind-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow-data:/mlflow
    networks:
      - aeromind-net

  prometheus:
    image: prom/prometheus:latest
    container_name: aeromind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - aeromind-net

  grafana:
    image: grafana/grafana:latest
    container_name: aeromind-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aeromind-net

networks:
  aeromind-net:
    driver: bridge

volumes:
  mlflow-data:
  qdrant-data:

